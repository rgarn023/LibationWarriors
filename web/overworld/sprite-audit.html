<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warrior Sprite Art Audit</title>
<style>body{background:#172331;color:#f3d9aa;font:13px monospace;margin:8px}h1{font-size:20px}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.item{min-height:158px;border:1px solid #857256;padding:3px;overflow:hidden}.item img{display:block;width:100%;height:120px;object-fit:contain;image-rendering:pixelated}.item small{display:block;font-size:10px;color:#d8d2cc}@media(max-width:650px){.item img{height:100px}}</style>
<h1>Existing Godot warrior artwork — reuse audit</h1><div id="grid"></div>
<script>
const kinds=['alchemist','bandit','barbarian','bard','black_mage','brawler','druid','militiaman','nimrod','paladin','pirate','red_mage','rogue','samurai','viking','white_mage'];
const grid=document.querySelector('#grid');
for(const k of kinds){
 const item=document.createElement('div');item.className='item';
 const label=document.createElement('small');label.textContent=k;
 const img=new Image();img.src='./assets/warriors/'+k+'_sheet.png';
 img.onload=()=>label.textContent=k+' '+img.naturalWidth+'×'+img.naturalHeight;
 img.onerror=()=>label.textContent=k+' ERROR';
 item.append(img,label);grid.append(item);
}
</script></html>
